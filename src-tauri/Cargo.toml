[package]
name = "callback-app"
version = "0.1.0"
description = "Windows-first local Callback desktop shell"
authors = ["Callback contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "callback_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
callback-protocol = { path = "../crates/protocol" }
sha2 = "=0.11.0"
chrono-tz = "=0.10.4"
iana-time-zone = "=0.1.65"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[features]
default = ["windows-platform"]
custom-protocol = ["tauri/custom-protocol"]
windows-platform = ["dep:windows"]

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
    "Win32_System_WinRT",
    "UI_Notifications",
    "Data_Xml_Dom",
    "Foundation",
], optional = true }
