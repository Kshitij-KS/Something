name: ci-windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release -p callback-app -p callback-native-host
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run validate:extension
      - run: npm run build
      - name: Runtime listener audit
        run: |
          if Select-String -Path src-tauri/src,crates -Pattern 'TcpListener|UdpSocket' -SimpleMatch {
            throw 'Callback source must not bind TCP/UDP listeners'
          }
      - name: Install NSIS (MSI uses WiX if present)
        run: choco install nsis --yes --no-progress
      - name: Bundle unsigned Windows installers
        # No code signing is configured. SmartScreen will warn on these artifacts.
        # `tauri build` emits NSIS/MSI from tauri.conf.json bundle.targets when the
        # toolchain is present. The step fails the job if bundling itself errors;
        # missing signed binaries is expected, not a silent success.
        run: npx tauri build --bundles nsis,msi
      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: callback-windows-unsigned
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/**
            src-tauri/target/release/bundle/msi/**
            src-tauri/target/release/callback.exe
            src-tauri/target/release/callback-native-host.exe
            target/release/callback.exe
            target/release/callback-native-host.exe
      - name: Unsigned-binary disclosure
        run: |
          Write-Host 'CI does not code-sign. NSIS/MSI (if produced) and the raw EXEs are unsigned.'
          Write-Host 'Windows SmartScreen / Mark-of-the-Web will warn until a certificate is added.'
          Write-Host 'Package managers do not remove that warning. Do not treat these artifacts as signed releases.'
          $nsis = Get-ChildItem -Recurse -ErrorAction SilentlyContinue src-tauri/target/release/bundle/nsis, target/release/bundle/nsis
          $msi = Get-ChildItem -Recurse -ErrorAction SilentlyContinue src-tauri/target/release/bundle/msi, target/release/bundle/msi
          if (-not $nsis -and -not $msi) {
            Write-Host 'No NSIS/MSI files were found. cargo release EXEs were still built; installer bundling did not emit packages.'
          } else {
            Write-Host "NSIS count=$($nsis.Count) MSI count=$($msi.Count)"
          }
