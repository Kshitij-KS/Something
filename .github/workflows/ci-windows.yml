name: ci-windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run stage:native-host
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -j 1
      - run: cargo build --locked --release -p callback-app -p callback-native-host
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test -- --run
      - run: npm run validate:extension
      - run: npm run build
      - name: Validate built extension
        run: npm run validate:extension -- extension/dist/manifest.json
      - name: Validate extension identity and release versions
        env:
          CALLBACK_EXTENSION_ID: ${{ vars.CALLBACK_EXTENSION_ID }}
        run: npm run verify:release-metadata
      - name: Static local-only audit
        run: npm run audit:local-only
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Bundle unsigned NSIS and MSI installers
        # No code signing is configured. SmartScreen will warn on these artifacts.
        # The package verifier fails unless each installer format exists separately.
        run: npx --no-install tauri build --bundles nsis,msi
      - name: Package extension and verify artifacts
        run: npm run package:windows
      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: callback-windows-unsigned
          if-no-files-found: error
          path: artifacts/*
      - name: Unsigned-binary disclosure
        shell: pwsh
        run: |
          Write-Host 'CI does not code-sign. NSIS/MSI installers and the extension ZIP are unsigned.'
          Write-Host 'SHA256SUMS.txt verifies downloaded bytes; it is not a publisher signature.'
          Write-Host 'Windows SmartScreen / Mark-of-the-Web will warn until a certificate is added.'
          Write-Host 'No package-manager or Chrome Web Store publication is implied.'
