[package]
name = "callback-native-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "callback_native_host"
path = "src/lib.rs"

[[bin]]
name = "callback-native-host"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
callback-protocol = { path = "../protocol" }
serde_json = "1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation"] }

[dev-dependencies]
proptest = "1"
